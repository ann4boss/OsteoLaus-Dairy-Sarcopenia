project:
  type: book
  output-dir: _output

book:
  title: "Dairy intake and muscle ageing in older women"
  subtitle: "A prospective analysis from the OsteoLaus cohort"
  author: "Anna Boss"
  date: today
  chapters:
    - index.qmd
    - chapters/01_introduction.qmd
    - chapters/02_methods.qmd
    - chapters/03_results.qmd
    - chapters/04_discussion.qmd
    - chapters/05_conclusion.qmd
    - references.qmd
  appendices:
    - appendices/A_supplementary.qmd

bibliography: references.bib
csl: csl/nlm-citation-sequence-brackets.csl

format:
  pdf:
    documentclass: MastersDoctoralThesis
    classoption:
      - 11pt
      - english
      - onehalfspacing
      - headsepline
    pdf-engine: pdflatex
    number-sections: true
    toc: false
    lof: false
    lot: false
    colorlinks: false
    link-citations: true
    keep-tex: true
    include-in-header: tex/header.tex
    include-before-body: tex/frontmatter.tex
